<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>OpiLog</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-prn: #f59e0b;
      --accent-reg: #10b981;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom) 16px; min-height: 100vh; }
    .container { max-width: 600px; margin: 0 auto; padding: 20px 0; }
    .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
    .stat-box { background: rgba(0,0,0,0.25); border-radius: 8px; padding: 12px; text-align: center; }
    .stat-val { font-size: 1.5rem; font-weight: 700; color: var(--accent); }
    .stat-label { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.05em; }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    button { background: #334155; color: white; border: none; border-radius: 6px; padding: 10px 14px; font-weight: 600; cursor: pointer; transition: opacity 0.15s; }
    button:active { opacity: 0.7; }
    button.prn { background: #d97706; }
    button.reg { background: #059669; }
    button.patch { background: #4f46e5; }
    .badge-prn { color: var(--accent-prn); font-size: 0.75rem; border: 1px solid var(--accent-prn); padding: 2px 6px; border-radius: 4px; }
    .badge-reg { color: var(--accent-reg); font-size: 0.75rem; border: 1px solid var(--accent-reg); padding: 2px 6px; border-radius: 4px; }
    .history-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--card-border); }
  </style>
</head>
<body>
  <div id="elm-app"></div>
  <script type="module" src="/src/index.ts"></script>
</body>
</html>
